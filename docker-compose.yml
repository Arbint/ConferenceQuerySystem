version: '3.8'
services:
  upgradeboothregister:
    build: .
    image: upgradeboothregister
    container_name: upgradeboothregister
    volumes:
      - /output/:/app/output
    ports:
      - '8501:8501/udp'
      - '8501:8501/tcp'
      - '8502:8502/udp'
      - '8502:8502/tcp'
      - '8503:8503/udp'
      - '8503:8503/tcp'
    command: ["poetry", "run", "launchserver"]

